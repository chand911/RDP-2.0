name: Windows RDP via Tailscale (A)

on:
  workflow_dispatch:
    inputs:
      ts_tailnet:
        description: "Tailscale tailnet ID (e.g. Tcy5UHDFMx11CNTRL)"
        required: true
      ts_api_key:
        description: "Tailscale API access token (tskey-api-...)"
        required: true
      ts_authkey:
        description: "Tailscale auth key (tskey-auth-..., reusable+ephemeral)"
        required: true
      gh_api_token:
        description: "GitHub PAT (classic; scopes: repo + workflow)"
        required: true
      test_mode:
        description: "5-minute test loop"
        type: boolean
        default: false
      runtime_minutes:
        description: "Runtime in minutes (355 max)"
        required: false
        default: "355"
      loops:
        description: "Handoffs (0 = infinite, 1 = stop, N = N more)"
        required: false
        default: "0"

concurrency:
  group: tailscale-rdp-singleton
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: pwsh

env:
  RDP_USER: chand
  RDP_PASS: Chand#NewP@ss2026X7!
  TS_HOSTNAME: bullet

jobs:
  rdp:
    runs-on: windows-2022
    timeout-minutes: 370
    steps:
      - name: Resolve inputs
        id: cfg
        env:
          RAW_TAILNET: ${{ inputs.ts_tailnet }}
          RAW_APIKEY:  ${{ inputs.ts_api_key }}
          RAW_AUTHKEY: ${{ inputs.ts_authkey }}
          RAW_PAT:     ${{ inputs.gh_api_token }}
          RAW_TEST:    ${{ inputs.test_mode == true && 'true' || 'false' }}
          RAW_RUNTIME: ${{ inputs.runtime_minutes || '355' }}
          RAW_LOOPS:   ${{ inputs.loops || '0' }}
        run: |
          function ToIntOr($v, $def){ if("$v" -match '^\d+$'){[int]$v}else{[int]$def} }

          $tailnet = $env:RAW_TAILNET
          $apiKey  = $env:RAW_APIKEY
          $authKey = $env:RAW_AUTHKEY
          $pat     = $env:RAW_PAT
          if (-not $tailnet -or -not $apiKey -or -not $authKey -or -not $pat) {
            Write-Error "Missing required inputs"; exit 1
          }

          $isTest = ($env:RAW_TEST -match '^(?i:true|1|yes|on)$')

          $runtime = ToIntOr $env:RAW_RUNTIME 355
          if ($isTest) { $runtime = 5 }
          if ($runtime -gt 360) { $runtime = 355 }
          if ($runtime -lt 1)    { $runtime = 355 }

          $loops = ToIntOr $env:RAW_LOOPS 0
          if ($loops -lt 0) { $loops = 0 }

          "tailnet=$tailnet" | Out-File -Append $env:GITHUB_OUTPUT
          "apikey=$apiKey"   | Out-File -Append $env:GITHUB_OUTPUT
          "authkey=$authKey" | Out-File -Append $env:GITHUB_OUTPUT
          "pat=$pat"         | Out-File -Append $env:GITHUB_OUTPUT
          "runtime=$runtime" | Out-File -Append $env:GITHUB_OUTPUT
          "loops=$loops"     | Out-File -Append $env:GITHUB_OUTPUT
          "started=$(Get-Date -Format o)" | Out-File -Append $env:GITHUB_OUTPUT
          Write-Host "Resolved: test=$isTest runtime=$runtime loops=$loops"

      - name: Install Tailscale
        run: |
          $exe = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $exe)) {
            $url = 'https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe'
            $dst = "$env:TEMP\tailscale-setup.exe"
            Invoke-WebRequest -Uri $url -OutFile $dst -UseBasicParsing
            Start-Process -FilePath $dst -ArgumentList "/quiet" -Wait
          }
          Start-Service Tailscale -ErrorAction SilentlyContinue
          & "C:\Program Files\Tailscale\tailscale.exe" version

      - name: Create RDP user (ADSI direct)
        run: |
          $u = "${{ env.RDP_USER }}"
          $p = "${{ env.RDP_PASS }}"

          Write-Host "=== Starting user creation for: $u ==="

          # Remove existing user
          try {
            $existing = [ADSI]"WinNT://./$u,user"
            if ($existing.Name) {
              Write-Host "Removing existing user $u"
              ([ADSI]"WinNT://./").Remove($existing.ADsPath)
              Start-Sleep -Seconds 1
            }
          } catch {}

          $created = $false

          # Method 1: ADSI direct (bypasses password policy)
          try {
            $comp = [ADSI]"WinNT://./"
            $user = $comp.Create("User", $u)
            $user.SetInfo()
            $user.SetPassword($p)
            $user.SetInfo()
            Write-Host "[OK] Created via ADSI direct"
            $created = $true
          } catch {
            Write-Warning "ADSI direct failed: $_"
          }

          # Method 2: net user with /passwordreq:no
          if (-not $created) {
            Write-Host "Trying net user /passwordreq:no..."
            $out = net user $u "$p" /add /y /passwordreq:no 2>&1
            $out | ForEach-Object { Write-Host $_ }
            $check = Get-LocalUser -Name $u -ErrorAction SilentlyContinue
            if ($check) {
              Write-Host "[OK] Created via net user"
              $created = $true
            }
          }

          # Method 3: secedit policy override then New-LocalUser
          if (-not $created) {
            Write-Host "Applying secedit policy override..."
            $inf = @"
[Unicode]
Unicode=yes
[System Access]
MinimumPasswordLength = 0
PasswordComplexity = 0
PasswordHistorySize = 0
MaximumPasswordAge = -1
MinimumPasswordAge = 0
[Version]
signature="`$CHICAGO`$"
Revision=1
"@
            $infPath = "$env:TEMP\pwpol.inf"
            $dbPath  = "$env:TEMP\pwpol.sdb"
            $inf | Out-File -Encoding Unicode $infPath
            secedit /configure /db $dbPath /cfg $infPath /areas SECURITYPOLICY 2>&1 | ForEach-Object { Write-Host $_ }
            gpupdate /force 2>&1 | Out-Null
            Start-Sleep -Seconds 2

            try {
              $sec = ConvertTo-SecureString $p -AsPlainText -Force
              New-LocalUser -Name $u -Password $sec -PasswordNeverExpires -AccountNeverExpires -ErrorAction Stop
              Write-Host "[OK] Created via New-LocalUser after secedit"
              $created = $true
            } catch {
              Write-Warning "New-LocalUser still failed: $_"
            }
          }

          if (-not $created) {
            Write-Error "FAILED to create user $u with all 3 methods"
            exit 1
          }

          # Verify
          $verify = Get-LocalUser -Name $u -ErrorAction SilentlyContinue
          if (-not $verify) {
            Write-Error "User $u not found after creation"
            exit 1
          }
          Write-Host "[OK] User $u verified — enabled=$($verify.Enabled)"

          # Enable + groups
          Enable-LocalUser -Name $u -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group Administrators -Member $u -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u -ErrorAction SilentlyContinue
          Write-Host "[OK] User $u added to Administrators + Remote Desktop Users"

          # Password never expires
          wmic useraccount where "name='$u'" set PasswordExpires=false 2>$null | Out-Null

          # Enable RDP
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" | Out-Null

          # Disable NLA
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name UserAuthentication -Value 0 -ErrorAction SilentlyContinue

          $deny = (Get-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server").fDenyTSConnections
          Write-Host "[OK] fDenyTSConnections=$deny (0 = RDP enabled)"
          Write-Host "=== RDP ready: user=$u passLen=$($p.Length) ==="

      - name: Startup purge (devices containing 'bullet')
        run: |
          $hdr = @{ Authorization = "Bearer ${{ steps.cfg.outputs.apikey }}" }
          $tn  = [uri]::EscapeDataString("${{ steps.cfg.outputs.tailnet }}")
          $match = { param($d)
            ($d.name -match '(?i)bullet') -or ($d.hostname -match '(?i)bullet') -or ($d.DNSName -match '(?i)bullet')
          }
          try {
            $resp = Invoke-RestMethod -Method GET -Headers $hdr -Uri "https://api.tailscale.com/api/v2/tailnet/$tn/devices"
            foreach ($d in $resp.devices) {
              if (& $match $d) {
                try {
                  Invoke-RestMethod -Method DELETE -Headers $hdr -Uri ("https://api.tailscale.com/api/v2/device/{0}" -f $d.id) | Out-Null
                  Write-Host "Deleted at start: $($d.name)"
                } catch {}
              }
            }
          } catch { Write-Warning "Startup purge failed: $_" }

      - name: Tailscale up (hostname=bullet)
        id: up
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          & $ts logout | Out-Null
          & $ts up --authkey "${{ steps.cfg.outputs.authkey }}" --hostname "${{ env.TS_HOSTNAME }}" --accept-routes --accept-dns=false
          Start-Sleep -Seconds 3

          $ip4 = (& $ts ip -4 | Select-Object -First 1)
          if (-not $ip4) {
            Write-Error "Tailscale failed to get IP"; exit 1
          }
          $status = & $ts status --json | ConvertFrom-Json
          $fqdn = $status.Self.DNSName
          $derp = $status.Self.DERP
          "ip4=$ip4"   | Out-File -Append $env:GITHUB_OUTPUT
          "fqdn=$fqdn" | Out-File -Append $env:GITHUB_OUTPUT
          "derp=$derp" | Out-File -Append $env:GITHUB_OUTPUT

          @"
          ### RDP (A) — ${{ steps.cfg.outputs.started }}
          Host: $env:TS_HOSTNAME
          IPv4: $ip4
          MagicDNS: $fqdn
          DERP: $derp
          User: $env:RDP_USER
          Pass: $env:RDP_PASS
          "@ | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Keep alive
        run: |
          $mins=[int]"${{ steps.cfg.outputs.runtime }}"
          $end=(Get-Date).AddMinutes($mins)
          while((Get-Date) -lt $end){
            $left=[int]([math]::Ceiling(($end-(Get-Date)).TotalMinutes))
            Write-Host "RDP alive... ($left min left)"
            Start-Sleep -Seconds 60
          }

      - name: Exit purge (devices containing 'bullet')
        if: always()
        continue-on-error: true
        run: |
          $hdr = @{ Authorization = "Bearer ${{ steps.cfg.outputs.apikey }}" }
          $tn  = [uri]::EscapeDataString("${{ steps.cfg.outputs.tailnet }}")
          $match = { param($d)
            ($d.name -match '(?i)bullet') -or ($d.hostname -match '(?i)bullet') -or ($d.DNSName -match '(?i)bullet')
          }
          try {
            $resp = Invoke-RestMethod -Method GET -Headers $hdr -Uri "https://api.tailscale.com/api/v2/tailnet/$tn/devices"
            foreach ($d in $resp.devices) {
              if (& $match $d) {
                try {
                  Invoke-RestMethod -Method DELETE -Headers $hdr -Uri ("https://api.tailscale.com/api/v2/device/{0}" -f $d.id) | Out-Null
                  Write-Host "Deleted at exit: $($d.name)"
                } catch {}
              }
            }
          } catch { Write-Warning "Exit purge failed: $_" }

      - name: Dispatch workflow B
        if: always()
        env:
          GH_TOKEN: ${{ steps.cfg.outputs.pat }}
        run: |
          $loops=[int]"${{ steps.cfg.outputs.loops }}"
          if ($loops -eq 1) { Write-Host "Loops finished; not dispatching."; exit 0 }
          if ($loops -gt 1) { $next=$loops-1 } else { $next=0 }

          $repo = "${{ github.repository }}"
          $token = "$env:GH_TOKEN"
          $uri = "https://api.github.com/repos/$repo/actions/workflows/windows-rdp-tailscale-B.yml/dispatches"

          Write-Host "Dispatch URI: $uri"
          Write-Host "Ref: ${{ github.ref_name }}"
          Write-Host "Next loops: $next"

          try {
            $wfCheck = Invoke-RestMethod -Method GET -Headers @{
              Authorization = "Bearer $token"
              Accept = "application/vnd.github+json"
            } -Uri "https://api.github.com/repos/$repo/actions/workflows"
            $bExists = $wfCheck.workflows | Where-Object { $_.path -match 'windows-rdp-tailscale-B\.yml' }
            if (-not $bExists) {
              Write-Error "workflow B not found in repo. Available workflows:"
              $wfCheck.workflows | ForEach-Object { Write-Host "  $($_.path)" }
              exit 1
            }
            Write-Host "Found B workflow: $($bExists.path) (id=$($bExists.id))"
          } catch {
            Write-Error "Failed to list workflows: $_"
            if ($_.ErrorDetails.Message) { Write-Host $_.ErrorDetails.Message }
            exit 1
          }

          $body = @{
            ref    = "${{ github.ref_name }}"
            inputs = @{
              ts_tailnet      = "${{ steps.cfg.outputs.tailnet }}"
              ts_api_key      = "${{ steps.cfg.outputs.apikey }}"
              ts_authkey      = "${{ steps.cfg.outputs.authkey }}"
              gh_api_token    = "$token"
              test_mode       = "false"
              runtime_minutes = "${{ steps.cfg.outputs.runtime }}"
              loops           = "$next"
            }
          } | ConvertTo-Json -Depth 5

          try {
            Invoke-RestMethod -Method POST `
              -Uri $uri `
              -Headers @{ Authorization = "Bearer $token"; Accept = "application/vnd.github+json" } `
              -Body $body `
              -ErrorAction Stop
            Write-Host "[OK] Dispatch B successful"
          } catch {
            Write-Error "Dispatch failed: $($_.Exception.Message)"
            if ($_.ErrorDetails.Message) { Write-Host $_.ErrorDetails.Message }
            exit 1
          }
